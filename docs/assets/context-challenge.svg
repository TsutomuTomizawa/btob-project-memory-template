<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BtoBではコンテキストが散らばり、そのままLLMに渡しにくい</title>
  <desc id="desc">BtoB取引では時間、ツール、顧客境界、社内判断が分散し、必要な文脈だけを安全に選ぶ必要があることを示す図。</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152033; }
      .lead { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536174; }
      .card { fill: #ffffff; stroke: #d8e0ec; stroke-width: 2; }
      .card-title { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182235; }
      .text { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d4a5c; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66758a; }
      .pill { fill: #eef4ff; stroke: #c9d9ff; }
      .pill2 { fill: #f0fbf7; stroke: #bde8d8; }
      .pill3 { fill: #fff7e8; stroke: #f0d59c; }
      .risk { fill: #fff1f2; stroke: #f4b7c1; }
      .line { stroke: #97a6ba; stroke-width: 3; fill: none; stroke-linecap: round; }
      .dashed { stroke: #b7c2d2; stroke-width: 2; fill: none; stroke-dasharray: 7 8; }
      .accent { fill: #3b82f6; }
      .green { fill: #14b8a6; }
      .orange { fill: #f59e0b; }
      .red { fill: #e11d48; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1f2a44" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="675"/>
  <text class="title" x="70" y="72">BtoBでは、LLMに渡す文脈が散らばりやすい</text>
  <text class="lead" x="72" y="108">商談・導入・運用・更新の間で、情報と判断理由が複数の場所に分散します。</text>

  <g filter="url(#shadow)">
    <rect class="card" x="70" y="155" width="250" height="310" rx="18"/>
    <text class="card-title" x="96" y="202">時間が長い</text>
    <path class="line" d="M112 250 H278" marker-end="url(#arrow)"/>
    <circle class="accent" cx="116" cy="250" r="9"/>
    <circle class="green" cx="176" cy="250" r="9"/>
    <circle class="orange" cx="236" cy="250" r="9"/>
    <text class="text" x="96" y="307">商談</text>
    <text class="text" x="96" y="342">導入</text>
    <text class="text" x="96" y="377">運用</text>
    <text class="text" x="96" y="412">更新</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="355" y="155" width="250" height="310" rx="18"/>
    <text class="card-title" x="381" y="202">情報が散る</text>
    <rect class="pill" x="382" y="235" width="190" height="42" rx="12"/>
    <text class="text" x="406" y="262">議事録</text>
    <rect class="pill2" x="382" y="291" width="190" height="42" rx="12"/>
    <text class="text" x="406" y="318">チャット</text>
    <rect class="pill3" x="382" y="347" width="190" height="42" rx="12"/>
    <text class="text" x="406" y="374">資料 URL</text>
    <rect class="pill" x="382" y="403" width="190" height="42" rx="12"/>
    <text class="text" x="406" y="430">CRM・表計算</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="640" y="155" width="250" height="310" rx="18"/>
    <text class="card-title" x="666" y="202">混ぜられない</text>
    <rect class="pill" x="668" y="238" width="82" height="52" rx="12"/>
    <text class="text" x="687" y="270">顧客A</text>
    <rect class="pill2" x="780" y="238" width="82" height="52" rx="12"/>
    <text class="text" x="799" y="270">顧客B</text>
    <path class="dashed" d="M765 224 V376"/>
    <rect class="risk" x="668" y="324" width="194" height="78" rx="14"/>
    <text class="text" x="692" y="356">内部懸念</text>
    <text class="small" x="692" y="382">非公開URL・契約条件</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="925" y="155" width="205" height="310" rx="18"/>
    <text class="card-title" x="951" y="202">そのままだと</text>
    <text class="text" x="951" y="254">長すぎる</text>
    <text class="text" x="951" y="294">探せない</text>
    <text class="text" x="951" y="334">混ざる</text>
    <text class="text" x="951" y="374">判断理由が</text>
    <text class="text" x="951" y="402">抜ける</text>
  </g>

  <path class="line" d="M320 310 H350" marker-end="url(#arrow)"/>
  <path class="line" d="M605 310 H635" marker-end="url(#arrow)"/>
  <path class="line" d="M890 310 H920" marker-end="url(#arrow)"/>

  <rect x="155" y="535" width="890" height="76" rx="20" fill="#152033"/>
  <text x="250" y="567" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#ffffff">必要なのは「全部貼る」ことではなく</text>
  <text x="250" y="597" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#ffffff">必要な文脈だけを安全に取り出せる構造</text>
</svg>
