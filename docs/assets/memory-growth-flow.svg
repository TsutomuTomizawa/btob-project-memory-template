<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">データが蓄積し、memoryが育っていく流れ</title>
  <desc id="desc">議事録やメモがrawとeventに保存され、digestでprofileとcurrentに反映され、次の質問や提案に使われる循環を示す図。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .lead { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #56657a; }
      .lane { fill: #ffffff; stroke: #d8e0ec; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #cad6e6; stroke-width: 2; }
      .raw { fill: #eff6ff; stroke: #bfdbfe; }
      .event { fill: #f0fdfa; stroke: #99f6e4; }
      .digest { fill: #fff7ed; stroke: #fed7aa; }
      .grown { fill: #f5f3ff; stroke: #ddd6fe; }
      .use { fill: #ecfdf5; stroke: #bbf7d0; }
      .label { font: 800 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182235; }
      .text { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d4a5c; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .step { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .num { fill: #2563eb; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; stroke-linecap: round; }
      .loop { stroke: #14b8a6; stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 12 10; }
      .thin { stroke: #b7c2d2; stroke-width: 2; fill: none; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2a44" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#14b8a6"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="70" y="68">データは、保存を繰り返すほど「使える文脈」に育つ</text>
  <text class="lead" x="72" y="104">原本を残し、出来事を追記し、重要な学びだけを profile / current に反映します。</text>

  <g filter="url(#shadow)">
    <rect class="lane" x="55" y="145" width="245" height="430" rx="20"/>
    <circle class="num" cx="86" cy="178" r="16"/>
    <text class="step" x="81" y="183">1</text>
    <text class="label" x="112" y="185">入力</text>
    <text class="text" x="82" y="232">議事録</text>
    <text class="text" x="82" y="267">チャットメモ</text>
    <text class="text" x="82" y="302">URL・資料</text>
    <text class="text" x="82" y="337">決定事項</text>
    <text class="text" x="82" y="372">TODO・リスク</text>
    <rect class="box" x="82" y="428" width="190" height="82" rx="16"/>
    <text class="text" x="106" y="463">人間が</text>
    <text class="text" x="106" y="490">エージェントに渡す</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="lane" x="335" y="145" width="245" height="430" rx="20"/>
    <circle class="num" cx="366" cy="178" r="16"/>
    <text class="step" x="361" y="183">2</text>
    <text class="label" x="392" y="185">まず保存</text>
    <rect class="raw" x="365" y="225" width="185" height="94" rx="16"/>
    <text class="label" x="391" y="260">raw/</text>
    <text class="small" x="391" y="288">長文原本を残す</text>
    <rect class="event" x="365" y="355" width="185" height="118" rx="16"/>
    <text class="label" x="391" y="390">events/</text>
    <text class="small" x="391" y="418">起きたことを</text>
    <text class="small" x="391" y="442">時系列で追記</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="lane" x="615" y="145" width="245" height="430" rx="20"/>
    <circle class="num" cx="646" cy="178" r="16"/>
    <text class="step" x="641" y="183">3</text>
    <text class="label" x="672" y="185">digest</text>
    <rect class="digest" x="645" y="230" width="185" height="96" rx="16"/>
    <text class="label" x="683" y="265">要約ではなく</text>
    <text class="small" x="675" y="294">重要な変化だけ反映</text>
    <path class="thin" d="M688 372 H787"/>
    <path class="thin" d="M688 402 H787"/>
    <path class="thin" d="M688 432 H787"/>
    <text class="text" x="665" y="485">pending event を</text>
    <text class="text" x="665" y="516">applied にする</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="lane" x="895" y="145" width="250" height="430" rx="20"/>
    <circle class="num" cx="926" cy="178" r="16"/>
    <text class="step" x="921" y="183">4</text>
    <text class="label" x="952" y="185">文脈が育つ</text>
    <rect class="grown" x="925" y="225" width="190" height="84" rx="16"/>
    <text class="label" x="948" y="259">profile.md</text>
    <text class="small" x="948" y="286">背景・判断軸</text>
    <rect class="grown" x="925" y="332" width="190" height="84" rx="16"/>
    <text class="label" x="948" y="366">current.md</text>
    <text class="small" x="948" y="393">状態・タスク・リスク</text>
    <rect class="grown" x="925" y="439" width="190" height="84" rx="16"/>
    <text class="label" x="948" y="473">sources.md</text>
    <text class="small" x="948" y="500">読んでよい資料</text>
  </g>

  <path class="arrow" d="M300 360 H330" marker-end="url(#arrow)"/>
  <path class="arrow" d="M580 360 H610" marker-end="url(#arrow)"/>
  <path class="arrow" d="M860 360 H890" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect class="use" x="245" y="612" width="710" height="96" rx="20"/>
    <text class="label" x="288" y="650">次回以降、LLM は profile / current / sources を読む</text>
    <text class="label" x="288" y="680">回答・提案・共有文に使い、次の会話もまた保存する</text>
  </g>

  <path class="loop" d="M955 625 C1045 615 1082 560 1082 500" marker-end="url(#arrowGreen)"/>
  <text class="small" x="930" y="604">使った後の会話や決定もまた保存する</text>

  <path class="loop" d="M245 661 C145 660 110 610 110 575" marker-end="url(#arrowGreen)"/>
  <text class="small" x="83" y="618">繰り返すほど精度が上がる</text>
</svg>
