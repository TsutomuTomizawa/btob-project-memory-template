<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">LLMにBtoB文脈を渡す</title>
  <desc id="desc">BtoB Project Memory Template のX記事用サムネイル。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .headline { font: 900 72px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .sub { font: 800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2563eb; letter-spacing: 0; }
      .small { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #dbe5f3; stroke-width: 2; }
      .line { stroke: #8aa0bd; stroke-width: 9; fill: none; stroke-linecap: round; }
      .blue { fill: #2563eb; }
      .teal { fill: #14b8a6; }
      .navy { fill: #0f172a; }
      .soft-blue { fill: #dbeafe; }
      .soft-teal { fill: #ccfbf1; }
      .soft-purple { fill: #ede9fe; }
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto">
      <path d="M2,2 L14,8 L2,14 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="675"/>
  <circle class="soft-blue" cx="1040" cy="110" r="180"/>
  <circle class="soft-teal" cx="108" cy="584" r="155"/>

  <g transform="translate(74 88)">
    <text class="headline" x="0" y="80">LLMに</text>
    <text class="headline" x="0" y="166">BtoB文脈を渡す</text>
    <text class="sub" x="4" y="226">Memory Vault Template</text>
    <text class="small" x="6" y="276">散らばる商談メモを、使える文脈へ。</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="82" y="415" width="180" height="122" rx="18"/>
    <rect class="soft-blue" x="108" y="444" width="88" height="14" rx="7"/>
    <rect fill="#cbd5e1" x="108" y="476" width="120" height="10" rx="5"/>
    <rect fill="#cbd5e1" x="108" y="500" width="96" height="10" rx="5"/>

    <rect class="card" x="285" y="435" width="160" height="108" rx="18"/>
    <circle class="teal" cx="326" cy="474" r="15"/>
    <rect fill="#cbd5e1" x="358" y="466" width="58" height="9" rx="5"/>
    <rect fill="#cbd5e1" x="320" y="504" width="90" height="9" rx="5"/>
  </g>

  <path class="line" d="M470 476 C545 450 590 420 650 360" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="676" y="214" width="268" height="260" rx="32" fill="#0f172a"/>
    <rect x="710" y="252" width="86" height="58" rx="14" class="soft-blue"/>
    <rect x="820" y="252" width="86" height="58" rx="14" class="soft-teal"/>
    <rect x="710" y="332" width="196" height="38" rx="12" fill="#ffffff" opacity="0.92"/>
    <rect x="710" y="392" width="196" height="38" rx="12" fill="#ffffff" opacity="0.92"/>
    <text x="735" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#0f172a">MEMORY</text>
  </g>

  <path class="line" d="M960 344 C1008 332 1030 332 1072 354" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <circle cx="1082" cy="356" r="52" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
    <rect x="1055" y="344" width="54" height="34" rx="14" fill="#0f172a"/>
    <circle cx="1072" cy="361" r="5" fill="#67e8f9"/>
    <circle cx="1092" cy="361" r="5" fill="#67e8f9"/>
    <rect x="1036" y="441" width="110" height="82" rx="18" fill="#ffffff" stroke="#dbe5f3" stroke-width="2"/>
    <rect class="soft-purple" x="1058" y="464" width="66" height="12" rx="6"/>
    <rect fill="#cbd5e1" x="1058" y="492" width="54" height="9" rx="5"/>
  </g>
</svg>
